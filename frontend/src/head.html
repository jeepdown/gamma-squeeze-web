<title>Gamma Squeeze</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter+Tight:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;700;900&display=swap">
<style>
/* Layout: mobile-first app column (max 560px) with a fixed bottom nav; the editor back office switches to a wide two-pane layout. */
:root{
  --bg:#F7F7F5; --ink:#16171D; --ink2:#3B3C45; --muted:#5D5D5A; --line:#E0DFDA; --tint:#EEEDE9; --strong:#16171D;
  --accent:#00098F; --accent-text:#00098F; --band:#00098F; --band-deep:#000670; --band-ink:#00098F; --on-band:#FFFFFF; --on-band-2:#C9CEF5; --on-band-3:#DDE0FA;
  --up:#05703F; --down:#B42318; --up-band:#7EE2B8; --down-band:#FFB3B3;
  --pos:#1F2A8C; --neg:#8E1B1F; --warn:#A3560B; --amber:#A3560B; --warn-bg:#F6E7CF; --good-bg:#E3EEDF; --bad-bg:#F5E2DC;
  --veil:rgba(247,247,245,0.88); --scrim:rgba(22,23,29,0.45); --panel:#FFFFFF;
  --mast-a:#E6E5E0; --mast-b:#EFEEEA; --g0:#FFFFFF; --g1:#F6F5F2; --g2:#EDECE8; --g3:#E3E2DD; --edge:rgba(255,255,255,.9);
  --mark:rgba(22,23,29,0.045); --lift:0 1px 2px rgba(20,20,20,.05),0 12px 30px -14px rgba(20,20,20,.22); --stack:0 -14px 28px -20px rgba(20,20,20,.35);
  --f-latin:'Inter Tight', 'Noto Sans SC', system-ui, sans-serif;
  --f-serif:'Noto Serif SC', 'Songti SC', serif;
  --f-sans:'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121214; --ink:#ECEBE7; --ink2:#C8C7C2; --muted:#9A9994; --line:#2C2C30; --tint:#1D1D20; --strong:#ECEBE7;
  --accent:#4A55E8; --accent-text:#A9B0FF; --band:#0B1494; --band-deep:#070E6A; --band-ink:#A9B0FF; --on-band:#FFFFFF; --on-band-2:#C9CEF5; --on-band-3:#DDE0FA;
  --up:#4ADE9B; --down:#FF8A80; --up-band:#7EE2B8; --down-band:#FFB3B3;
  --pos:#8C95FF; --neg:#E0646A; --warn:#F0B35A; --amber:#F0B35A; --warn-bg:#2A2110; --good-bg:#10261B; --bad-bg:#2B1416;
  --veil:rgba(17,18,21,0.88); --scrim:rgba(0,0,0,0.6); --panel:#1C1C1F; color-scheme:dark;
  --mast-a:#1C1C1E; --mast-b:#18181A; --g0:#111113; --g1:#161618; --g2:#1B1B1E; --g3:#212124; --edge:rgba(255,255,255,.04);
  --mark:rgba(255,255,255,0.035); --lift:0 1px 2px rgba(0,0,0,.45),0 12px 30px -14px rgba(0,0,0,.8); --stack:0 -14px 28px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#121214; --ink:#ECEBE7; --ink2:#C8C7C2; --muted:#9A9994; --line:#2C2C30; --tint:#1D1D20; --strong:#ECEBE7;
  --accent:#4A55E8; --accent-text:#A9B0FF; --band:#0B1494; --band-deep:#070E6A; --band-ink:#A9B0FF; --on-band:#FFFFFF; --on-band-2:#C9CEF5; --on-band-3:#DDE0FA;
  --up:#4ADE9B; --down:#FF8A80; --up-band:#7EE2B8; --down-band:#FFB3B3;
  --pos:#8C95FF; --neg:#E0646A; --warn:#F0B35A; --amber:#F0B35A; --warn-bg:#2A2110; --good-bg:#10261B; --bad-bg:#2B1416;
  --veil:rgba(17,18,21,0.88); --scrim:rgba(0,0,0,0.6); --panel:#1C1C1F; color-scheme:dark;
  --mast-a:#1C1C1E; --mast-b:#18181A; --g0:#111113; --g1:#161618; --g2:#1B1B1E; --g3:#212124; --edge:rgba(255,255,255,.04);
  --mark:rgba(255,255,255,0.035); --lift:0 1px 2px rgba(0,0,0,.45),0 12px 30px -14px rgba(0,0,0,.8); --stack:0 -14px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.latin{font-family:var(--f-latin)}
.serif{font-family:var(--f-serif)}
.up{color:var(--up)} .down{color:var(--down)}
.band .up{color:var(--up-band)} .band .down,.strip .down{color:var(--down-band)} .strip .up{color:var(--up-band)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));position:relative}
#app.wide{max-width:1440px;padding-bottom:40px}
@media (min-width:600px){#app:not(.wide){border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* Accent band (header) */
.band{background:var(--band);color:var(--on-band)}
.band .sub{color:var(--on-band-2)}
.topbar{display:flex;justify-content:space-between;align-items:center;height:52px}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:inherit;flex-shrink:0}
.brand{font-family:var(--f-latin);font-weight:800;letter-spacing:-0.035em;line-height:0.95}
.strip{background:var(--band-deep);color:var(--on-band);display:flex;gap:20px;overflow-x:auto;padding-block:10px;white-space:nowrap;font-family:var(--f-mono);font-size:12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .q{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.strip .q .k{color:var(--on-band-2);font-size:10px}
.strip button.q{text-align:left}

.chan{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.chan::-webkit-scrollbar{display:none}
.chan button{padding:13px 0 10px;color:var(--ink2);border-bottom:3px solid transparent;flex-shrink:0}
.chan button[aria-selected="true"]{font-weight:700;color:var(--accent-text);border-bottom-color:var(--accent-text)}

.sec{padding-top:20px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:3px solid var(--strong);padding-top:10px}
.sec-head.plain{border-top:0;padding-top:0}
.h2{margin:0;font-family:var(--f-serif);font-weight:900;font-size:19px;line-height:1.3}
.h3{margin:0;font-family:var(--f-serif);font-weight:700;font-size:17px;line-height:1.42}
.tag{font-size:10px;font-weight:700;color:var(--accent-text);border:1px solid var(--accent-text);padding:2px 6px;letter-spacing:0.06em;white-space:nowrap}
.tag.solid{background:var(--band);border-color:var(--band);color:#fff}
.tag.pro{font-family:var(--f-latin);font-size:11px;letter-spacing:0.1em;background:var(--band);border-color:var(--band);color:#fff;padding:3px 8px}
.tag.gray{color:var(--muted);border-color:var(--line)}
.tag.red{color:var(--neg);border-color:var(--neg)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.good{color:var(--up);border-color:var(--up)}
.lockmark{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700}
.more{display:flex;align-items:center;justify-content:center;height:44px;font-size:13px;font-weight:700;color:var(--accent-text);width:100%}
.link{font-size:12px;color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;font-size:14px;font-weight:700;border:1px solid var(--strong);background:var(--bg);color:var(--ink);white-space:nowrap;flex-shrink:0}
.btn.primary{background:var(--band);border-color:var(--band);color:#fff}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:12px}
.btn.xs{height:32px;padding:0 10px;font-size:12px;font-weight:600}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.on-band{border-color:#fff;color:#fff;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .when{width:46px;flex-shrink:0;display:flex;flex-direction:column;gap:3px}
.row .when .t{font-family:var(--f-mono);font-size:12px;font-weight:600}
.row .when .s{font-size:10px;color:var(--accent-text);font-weight:700}
.row .txt{flex:1;min-width:0;font-size:14px;line-height:1.65}
.row .txt strong{font-weight:700}
.newdot{font-size:10px;font-weight:700;color:#fff;background:var(--band);padding:0 4px;align-self:flex-start}
.sdata{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.sd{display:inline-flex;gap:6px;align-items:baseline;font-size:12px}
.sd .k{color:var(--muted)}
.sd .num{font-weight:600}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.tile .sym{font-family:var(--f-latin);font-weight:700;font-size:14px}
.tile .px{font-family:var(--f-mono);font-size:12px}
.tile .ch{font-family:var(--f-mono);font-size:11px}

.card-feature{display:block;background:var(--band);color:#fff;width:100%;text-align:left}
.card-feature .art{height:170px;position:relative;overflow:hidden;background:var(--band-deep)}
.card-feature .body{padding:16px 16px 18px}
.card-feature h3{margin:0;font-family:var(--f-serif);font-weight:900;font-size:22px;line-height:1.38}
.card-feature p{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--on-band-3)}
.card-feature .meta{display:flex;gap:10px;margin-top:14px;font-size:12px;color:var(--on-band-2)}
.kicker{font-size:11px;font-weight:700;color:var(--accent-text)}
.art-row{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.art-row .meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{width:72px;height:72px;flex-shrink:0;background:var(--band);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-latin);font-weight:800;font-size:15px;letter-spacing:-0.02em}

.box{border:1px solid var(--strong);padding:16px}
.box.soft{border-color:var(--line)}
.tintbox{background:var(--tint);padding:12px 14px}
.lockwrap{position:relative;overflow:hidden}
.lockwrap .blurred{filter:blur(5px);opacity:.7;pointer-events:none;user-select:none}
.lockveil{position:absolute;inset:0;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv3 .k{font-size:11px;color:var(--muted)}
.kv3 .v{font-family:var(--f-mono);font-size:15px;font-weight:600;margin-top:3px}
.regime{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.pos{background:var(--pos)} .dot.neg{background:var(--neg)}

.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.metrics>div{padding:14px 16px;border-right:1px solid var(--line)}
.metrics>div:last-child{border-right:0}
.metrics .k{font-size:11px;color:var(--muted)}
.metrics .v{font-family:var(--f-mono);font-size:15px;font-weight:600;margin-top:4px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.seg button{height:32px;font-family:var(--f-latin);font-size:12px;font-weight:600}
.band .seg button[aria-selected="true"]{background:#fff;color:#00098F;font-weight:700}
.seg.light{border:1px solid var(--line);padding:3px}
.seg.light button[aria-selected="true"]{background:var(--band);color:#fff}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);font-size:13px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tabs button{height:42px;color:var(--ink2);border-bottom:2px solid transparent;flex-shrink:0}
.tabs button[aria-selected="true"]{font-weight:700;color:var(--accent-text);border-bottom-color:var(--accent-text)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent-text);color:var(--accent-text);font-weight:700;background:var(--tint)}

/* Article */
.article-body{font-family:var(--f-serif);font-size:calc(17px * var(--fs,1));line-height:1.85;color:var(--ink);display:flex;flex-direction:column;gap:18px}
.article-body p{margin:0}
.article-body blockquote{margin:4px 0;padding:18px;background:var(--band);color:#fff;font-weight:900;font-size:calc(20px * var(--fs,1));line-height:1.5}
.disclosure{font-family:var(--f-sans);font-size:12px;line-height:1.7;color:var(--muted);background:var(--tint);padding:12px 14px}
.fade{position:relative}
.fade::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,transparent,var(--bg))}
.paywall{border:1px solid var(--strong);padding:20px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-sans)}

.cmt{padding:16px 0;border-bottom:1px solid var(--line)}
.cmt .who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.cmt .who .t{color:var(--muted);font-size:12px;margin-left:auto}
.cmt p{margin:8px 0 0;font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.cmt .acts{display:flex;gap:4px;margin-top:6px}
.cmt .acts button{height:36px;padding:0 8px;color:var(--ink2);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.cmt .acts button:first-child{padding-left:0}
.cmt .acts button[aria-pressed="true"]{color:var(--accent-text);font-weight:700}
.reply{margin:8px 0 0 14px;padding:12px 0 0 14px;border-left:2px solid var(--accent-text)}
.badge{align-self:center;line-height:16px;white-space:nowrap;display:inline-block;font-size:10px;font-weight:700;padding:1px 5px;border:1px solid var(--line);color:var(--muted)}
.badge.author{background:var(--band);border-color:var(--band);color:#fff}
.badge.pick{border-color:var(--band);color:var(--band)}
.badge.pending{border-color:var(--warn);color:var(--warn)}
textarea.input,input.input,select.input{width:100%;border:1px solid var(--line);padding:10px;font-size:14px;border-radius:0}
textarea.input{resize:vertical;min-height:84px}
input.input,select.input{height:44px}
label.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}

/* Bottom nav */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;border-top:1px solid var(--line);background:var(--bg);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));font-size:10px;z-index:40}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);min-height:50px}
.bnav button[aria-current="page"]{color:var(--accent-text);font-weight:700}

/* Sheet & toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:4px solid var(--band)}
.sheet h2{margin:0 0 6px;font-family:var(--f-serif);font-weight:900;font-size:21px}
.sheet .x{position:sticky;top:-20px;float:right;margin:-12px -12px 0 0}
.drawer{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);background:var(--panel);z-index:90;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 24px max(20px,env(safe-area-inset-left,0px));overflow:auto;border-right:4px solid var(--band)}
.drawer button.item{display:flex;justify-content:space-between;align-items:center;width:100%;height:52px;border-bottom:1px solid var(--line);font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;font-size:13px;z-index:100;max-width:min(90vw,480px);text-align:center}
.benefits{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.benefits li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.benefits svg{flex-shrink:0;margin-top:3px;color:var(--accent-text)}

/* Lists */
.list-item{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--line);width:100%;text-align:left;padding:8px 0}
.list-item .grow{flex:1;min-width:0}
.wl-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:62px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--band)}
.switch[aria-checked="true"]::after{left:21px}

/* Pricing */
.plans{display:grid;gap:12px}
.plan{border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.hi{border:2px solid var(--accent-text)}
.plan .price{font-family:var(--f-latin);font-weight:800;font-size:34px;letter-spacing:-0.03em}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font-size:12px;color:var(--muted);font-weight:500}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:22%}

/* Admin */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.aside{background:var(--band);color:#fff;padding:20px 0;position:sticky;top:0;height:100vh;overflow:auto}
.aside .nav button{display:flex;justify-content:space-between;width:100%;padding:12px 20px;font-size:14px;color:var(--on-band-2);text-align:left}
.aside .nav button[aria-current="page"]{background:rgba(255,255,255,0.12);color:#fff;font-weight:700}
.aside .cnt{font-family:var(--f-mono);font-size:12px;background:#fff;color:#00098F;padding:0 6px}
.amain{padding:24px max(24px,env(safe-area-inset-right,0px)) 40px 24px;min-width:0}
.amain h1{margin:0;font-family:var(--f-serif);font-weight:900;font-size:26px}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--strong);padding-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
.kpi{border:1px solid var(--line);padding:14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:600;margin-top:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
.tbl th{background:var(--tint);text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:10px 12px;white-space:nowrap}
.tbl td{padding:12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr.sel td{background:var(--tint)}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:20px;margin-top:18px;align-items:start}
.sched{display:grid;grid-template-columns:120px repeat(4,minmax(90px,1fr)) 110px;min-width:640px}
.sched>div{padding:10px;border-bottom:1px solid var(--line);font-size:12px;display:flex;align-items:center}
.sched .hd{background:var(--tint);font-weight:600;color:var(--ink2)}
.st{font-size:11px;font-weight:700;padding:2px 6px}
.st.pub{background:var(--good-bg);color:var(--up)}
.st.pend{background:var(--warn-bg);color:var(--warn)}
.st.q{background:var(--tint);color:var(--muted)}
.funnel .bar{height:30px;background:var(--band);color:#fff;display:flex;align-items:center;padding:0 10px;font-family:var(--f-mono);font-size:12px;min-width:44px}
.funnel .step{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;margin-top:8px;font-size:13px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0}
.check .ok{color:var(--up)} .check .no{color:var(--warn)}
@media (max-width:860px){
  .admin{grid-template-columns:1fr}
  .aside{position:static;height:auto;padding:10px 0}
  .aside .nav{display:flex;overflow-x:auto}
  .aside .nav button{white-space:nowrap;width:auto;gap:8px}
  .aside .brandbox,.aside .foot{display:none}
  .amain{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .split{grid-template-columns:1fr}
}

/* ---------- Print layout ---------- */
.mast{padding-block:4px 16px}
.mast-meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--on-band-2);border-top:1px solid rgba(255,255,255,.55);border-bottom:1px solid rgba(255,255,255,.55);padding:6px 0;margin-top:4px;font-family:var(--f-serif)}
.mast-brand{font-size:clamp(34px,10.2vw,56px);margin-top:14px;white-space:nowrap}
.mast-sub{font-weight:500;font-size:12px;margin-top:10px;padding-top:10px;color:var(--on-band-2);border-top:3px double rgba(255,255,255,.7)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up-band);margin-right:6px;vertical-align:1px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.sec-head{border-top-width:3px;position:relative}
.sec-head::after{content:"";position:absolute;left:0;right:0;top:2px;border-top:1px solid var(--strong)}
.sec-head.plain::after{display:none}
.sec-head .h2{margin-top:3px}
.contents{border-top:1px solid var(--strong);margin-top:18px}
.contents-h{display:flex;justify-content:space-between;align-items:center;padding:10px 0 4px}
.ct-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.ct-n{font-size:20px;font-weight:600;color:var(--accent-text);line-height:1}
.ct-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.ct-title{font-weight:700;font-size:16px;line-height:1.45}
.lede::first-letter{float:left;font-size:3.6em;line-height:.86;font-weight:900;color:var(--accent-text);padding:6px 10px 0 0}
.lede{font-size:1.04em}
.art-h{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--strong);font-family:var(--f-serif);font-weight:900;font-size:calc(21px * var(--fs,1));line-height:1.4}
.art-toc{font-family:var(--f-sans);border-top:3px solid var(--strong);border-bottom:1px solid var(--line);padding:10px 0 6px}
.toc-i{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}
.toc-i:first-of-type{border-top:0}
.toc-i .num{color:var(--accent-text);font-weight:600}
.toc-i svg{color:var(--muted)}
.art-locked{margin-top:18px;position:relative}
.art-locked .art-h{font-size:21px;color:var(--ink)}
.ghost-lines{position:relative;margin:16px 0 0;padding-bottom:6px}
.ghost-lines span{display:block;height:13px;background:var(--tint);margin:0 0 16px}
.ghost-lines::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 10%,var(--bg))}
.art-locked .paywall{margin-top:-6px;background:var(--bg);border-top:4px solid var(--band)}

/* ---------- 今日要点 deck ---------- */
.deck-wrap{padding-top:16px}
.deck-head{display:flex;justify-content:space-between;align-items:baseline}
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scroll-padding-inline:16px;scrollbar-width:none;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.deck-card{flex:0 0 82%;max-width:400px;scroll-snap-align:start;min-height:184px;border:1px solid var(--strong);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--bg)}
.deck-card.dark{background:var(--band);border-color:var(--band);color:#fff}
.deck-card.dark .up{color:var(--up-band)} .deck-card.dark .down{color:var(--down-band)}
.dk{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent-text)}
.deck-card.dark .dk,.deck-card.dark .dk-foot{color:var(--on-band-2)}
.dk-big{font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:auto}
.dk-title{font-weight:900;font-size:19px;line-height:1.42}
.dk-text{font-size:13px;line-height:1.65;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dk-foot{font-size:12px;margin-top:auto;display:flex;align-items:center;gap:8px}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots i{width:6px;height:6px;background:var(--line);transition:width .25s ease,background .25s}
.dots i.on{width:18px;background:var(--accent-text)}

/* ---------- Explore feed ---------- */
.feed{margin-top:30px}
.feed-body{padding-top:14px}
.feed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feed-page{animation:rise .45s ease backwards}
.fc{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);padding:14px;min-width:0;background:var(--bg)}
.fc.wide{grid-column:1/-1}
.fc-k{font-size:11px;font-weight:700;color:var(--accent-text);letter-spacing:.03em}
.fc-h{font-weight:900;font-size:17px;line-height:1.42}
.fc-h.big{font-size:21px}
.fc-p{font-size:13px;line-height:1.65;color:var(--ink2)}
.fc-m{font-size:12px;color:var(--muted);margin-top:2px}
.clamp3,.clamp4{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{-webkit-line-clamp:3} .clamp4{-webkit-line-clamp:4}
.stat-big{font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--accent-text);line-height:1.15;margin-top:4px}
.fc-quote{border:0;border-top:3px solid var(--strong);border-bottom:1px solid var(--strong);padding:18px 4px;position:relative}
.fc-quote .qmark{font-size:64px;line-height:.6;color:var(--accent-text);font-weight:900;height:26px}
.fc-q{font-weight:900;font-size:21px;line-height:1.5}
.fc-video{background:var(--band);border-color:var(--band);flex-direction:row;align-items:center;gap:14px;color:#fff}
.fc-video .play{width:46px;height:46px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding-left:3px}
.feed-sep{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-family:var(--f-serif);font-size:12px;color:var(--muted);letter-spacing:.12em}
.feed-sep::before,.feed-sep::after{content:"";flex:1;border-top:1px solid var(--strong)}
.feed-sentinel{display:flex;align-items:center;justify-content:center;gap:8px;height:64px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent-text);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Mini header & progress ---------- */
#minibar{position:fixed;top:0;left:50%;width:100%;max-width:560px;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--band);color:#fff;display:flex;align-items:center;gap:8px;z-index:30;transform:translate(-50%,-110%);transition:transform .22s ease}
#minibar .up{color:var(--up-band)} #minibar .down{color:var(--down-band)}
body.mini #minibar{transform:translate(-50%,0)}
body.mini .chan{top:calc(44px + env(safe-area-inset-top,0px))}
#minibar .mb-q{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-size:13px;white-space:nowrap}
#minibar .mb-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#minibar .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--up-band);transform-origin:left;transition:transform .1s linear}


/* ---------- Event tape ---------- */
.tape{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg);height:44px}
.tape.macro{border-bottom:1px solid var(--strong)}
.tape-l{width:92px}
.tape.earn .tape-l{box-shadow:inset 3px 0 0 var(--warn)}
.tape.macro .tape-l{box-shadow:inset 3px 0 0 var(--accent-text)}
.tape-l{flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding:0 12px 0 max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--strong);font-family:var(--f-serif);font-weight:900;font-size:14px;line-height:1.2;text-align:left}
.tape-l .xs{font-family:var(--f-sans);font-weight:500;color:var(--muted);font-size:10px}
.tape-track{display:flex;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;-webkit-mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,transparent,#000 14px,#000 calc(100% - 24px),transparent)}
.tape-track::-webkit-scrollbar{display:none}
.tape-row{display:flex;align-items:center;flex-shrink:0}
.ev{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:0 4px 0 14px;height:44px;font-size:13px}
.ev-d{font-size:11px;font-weight:600;color:var(--accent-text)}
.ev-k{font-size:10px;font-weight:700;padding:1px 5px;border:1px solid var(--neg);color:var(--neg)}
.tape.earn .ev-d{color:var(--warn)}
.ev-w.hi{font-weight:700}
.ev-e{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.ev-sep{width:4px;height:4px;background:var(--line);margin-left:10px;flex-shrink:0}
/* ---------- Motion ---------- */
.big-px{font-size:34px;font-weight:600;letter-spacing:-.02em}
.scrub{touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
svg[data-gsym]{touch-action:pan-y}
.flash-up{animation:fl-up .9s ease}
.flash-down{animation:fl-down .9s ease}
@keyframes fl-up{0%{background:rgba(74,222,155,.38)}100%{background:transparent}}
@keyframes fl-down{0%{background:rgba(255,120,110,.38)}100%{background:transparent}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.enter > *:not(.bnav){animation:rise .34s cubic-bezier(.2,.7,.2,1) backwards}
#app.enter > *:nth-child(2){animation-delay:.03s} #app.enter > *:nth-child(3){animation-delay:.06s} #app.enter > *:nth-child(4){animation-delay:.09s} #app.enter > *:nth-child(n+5):not(.bnav){animation-delay:.12s}
.tile,.art-row,.card-feature,.row,.fc,.deck-card,.ct-row,.btn,.chip,.list-item{transition:transform .14s ease,background-color .2s,border-color .2s}
.tile:active,.art-row:active,.card-feature:active,.row:active,.fc:active,.deck-card:active,.ct-row:active,.btn:active,.chip:active,.list-item:active{transform:scale(.982)}
@media (hover:hover){
  .fc:hover,.tile:hover,.deck-card:not(.dark):hover{border-color:var(--strong)}
  .art-row:hover .h3,.ct-row:hover .ct-title,.fc:hover .fc-h,.card-feature:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
}

/* ---------- Round 5: paper + restrained blue ---------- */
.latin{font-family:var(--f-sans)}
.band.paper{background:var(--bg);color:var(--ink);--on-band:var(--ink);--on-band-2:var(--muted);--on-band-3:var(--ink2);border-bottom:1px solid var(--strong);box-shadow:inset 0 -4px 0 var(--bg),inset 0 -5px 0 var(--strong)}
.band.paper .sub{color:var(--muted)}
.band.paper .up{color:var(--up)} .band.paper .down{color:var(--down)}
.band.paper .seg button{color:var(--ink2)}
.band.paper .seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.band.paper .brand{color:var(--ink)}
.band.paper.tk-head{border-bottom:0;box-shadow:none}
.band.paper.art-head{box-shadow:none;border-bottom:0}
.art-fig{margin:0 0 6px}
.art-fig-box{background:var(--tint);padding:8px 4px 2px;border-top:1px solid var(--strong)}
.art-fig figcaption{margin-top:6px}
.strip{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--line)}
.strip .q .k{color:var(--muted)}
.strip .up{color:var(--up)} .strip .down{color:var(--down)}
.mast{border-bottom:0}
.mast-brand{font-size:clamp(32px,9.6vw,52px);margin-top:10px}
.mast-sub{font-size:11px;margin-top:8px;padding-top:8px}
.tape{height:38px;background:var(--bg)}
.ev{height:38px;font-size:12.5px}
.tape-l{font-size:13px;width:86px}
.chan{background:var(--bg)}
.chan button[aria-selected="true"],.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--tint)}
.bnav{background:var(--panel)}
.bnav button[aria-current="page"]{color:var(--ink)}
.bnav button[aria-current="page"] svg{color:var(--band-ink)}
.tag{color:var(--ink2);border-color:var(--line)}
.tag.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kicker{color:var(--band-ink);letter-spacing:.06em}
.newdot{background:var(--amber);color:#fff}
.more{color:var(--ink)}
.dots i.on{background:var(--ink)}
.lede::first-letter{color:var(--ink)}
.stat-big{color:var(--ink)}
.ct-n{color:var(--amber)}
.thumb{background:var(--tint);color:var(--ink);flex-direction:column;align-items:stretch;justify-content:space-between;padding:6px 4px 2px;font-family:var(--f-sans);font-size:11px;font-weight:700;letter-spacing:0;border-top:2px solid var(--strong)}
.thumb-k{padding-left:2px}
.card-feature{background:transparent;color:var(--ink);border-bottom:1px solid var(--strong);padding-bottom:16px}
.card-feature .art{background:var(--tint);border-top:3px solid var(--strong)}
.card-feature .body{padding:6px 0 0}
.card-feature h3{font-size:25px;line-height:1.36}
.card-feature p{color:var(--ink2)}
.card-feature .meta{color:var(--muted)}
.art-cap{position:absolute;left:10px;bottom:8px;font-size:10px;color:var(--muted)}
.deck-card{background:var(--panel)}
.deck-card.dark{background:var(--panel);color:var(--ink);border-color:var(--strong);border-top:4px solid var(--strong)}
.deck-card.dark .dk,.deck-card.dark .dk-foot{color:var(--muted)}
.deck-card.dark .up{color:var(--up)} .deck-card.dark .down{color:var(--down)}
.deck-card .dk{color:var(--band-ink)}
.fc{border:0;border-top:1px solid var(--strong);padding:12px 0 16px;background:transparent}
.feed-grid{gap:0 18px}
.fc-k{color:var(--band-ink)}
.fc-video{background:var(--ink);color:var(--bg);padding:16px;border-top:0}
.fc-video .fc-h{color:var(--bg)!important}
.fc-video .fc-k{color:var(--muted)!important}
.fc-video .play{border-color:var(--bg)}
.tile{background:var(--panel)}
.box{background:var(--panel)}
.tintbox{background:var(--tint)}
.paywall{background:var(--panel)}
.page-foot{margin-top:36px;padding-block:24px 28px;font-size:11px;line-height:1.7;color:var(--muted);border-top:3px double var(--strong)}
.page-foot button{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.page-foot>div{margin-top:8px}
#minibar{background:var(--panel);color:var(--ink);border-bottom:1px solid var(--strong)}
#minibar .up{color:var(--up)} #minibar .down{color:var(--down)}
#minibar .progress{background:var(--band-ink)}
.drawer{background:var(--panel)}
input.input,textarea.input,select.input{background:var(--panel)}

/* ---------- Round 6: beige masthead + tinted zones ---------- */
body::before{background:var(--mast-a)}
.mast{background:linear-gradient(180deg,var(--mast-a),var(--mast-b));color:var(--band-ink);padding-block:4px 22px;border-bottom:1px solid var(--strong)}
.mast .icon-btn{color:var(--band-ink)}
.mast-brand{margin:18px 0 0;color:var(--band-ink);font-size:clamp(34px,10.6vw,58px);letter-spacing:-0.02em;line-height:0.95;font-weight:900}
.mast-sub{color:var(--muted);border-top:0;padding-top:0;margin-top:12px;font-size:12px;letter-spacing:.01em}
.strip{background:var(--mast-b);border-bottom:1px solid var(--line)}
.tape{background:var(--panel)}
.zone{position:relative;overflow:hidden;padding:24px 0 26px;background:linear-gradient(180deg,var(--za),var(--zb));border-bottom:1px solid var(--line)}
.zone .sec{padding-top:0}
.zone::before{content:attr(data-mark);position:absolute;right:-4px;top:-10px;font-family:var(--f-latin);font-weight:900;font-size:84px;letter-spacing:-0.04em;line-height:1;color:var(--mark);pointer-events:none;white-space:nowrap}
.zone > *{position:relative}
.z-lead{--za:var(--z-lead-a);--zb:var(--z-lead-b);padding-top:6px}
.z-snap{--za:var(--z-snap-a);--zb:var(--z-snap-b)}
.z-front{--za:var(--z-front-a);--zb:var(--z-front-b)}
.z-official{--za:var(--z-official-a);--zb:var(--z-official-b)}
.z-gamma{--za:var(--z-gamma-a);--zb:var(--z-gamma-b)}
.z-cal{--za:var(--z-cal-a);--zb:var(--z-cal-b)}
.z-video{--za:var(--z-video-a);--zb:var(--z-video-b)}
.z-book{--za:var(--z-book-a);--zb:var(--z-book-b)}
.z-news{--za:var(--z-news-a);--zb:var(--z-news-b)}
.z-feed{--za:var(--z-feed-a);--zb:var(--z-feed-b)}
.zone .feed{margin-top:0}
.zone .row{border-bottom-color:rgba(120,95,50,.18)}
.deck-card,.tile,.box,.ofc{box-shadow:var(--lift);border-color:transparent}
.deck-card.dark{border-top:4px solid var(--band-ink)}
.tile{border-top:2px solid var(--strong)}
.zone .tintbox{background:var(--panel);box-shadow:var(--lift)}
.card-feature .art{box-shadow:var(--lift)}
.ofc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.ofc{background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;border-top:2px solid var(--band-ink)}
.ofc-k{font-size:11px;font-weight:700;color:var(--ink2)}
.ofc-v{font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ofc-src{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px}
.okdot{width:6px;height:6px;border-radius:50%;background:var(--up)}
@media (max-width:360px){.ofc-v{font-size:16px}}

/* ---------- Round 7: heatmap, bonds, futures ---------- */
.z-heat{--za:var(--z-gamma-a);--zb:var(--z-gamma-b)}
.z-bond{--za:var(--z-official-a);--zb:var(--z-official-b)}
.z-fut{--za:var(--z-cal-a);--zb:var(--z-cal-b)}
.tag.elite{background:var(--amber);border-color:var(--amber);color:#fff;font-family:var(--f-sans);letter-spacing:.04em}
.heat-kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.heat-kpi>div{background:var(--panel);padding:10px;box-shadow:var(--lift);border-top:2px solid var(--strong)}
.heat-kpi .k{font-size:11px;color:var(--muted)} .heat-kpi .v{font-size:17px;font-weight:600;margin-top:2px}
